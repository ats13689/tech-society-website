<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員簽到 | 科技學會 ATS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f0ff;
            --accent: #8338ec;
            --success: #00ff88;
            --warning: #ffbe0b;
            --danger: #ff006e;
            --late: #ff6b35;
            --early: #845ef7;
            --bg-dark: #0a0e17;
            --bg-card: #131a2b;
            --text-primary: #ffffff;
            --text-secondary: #8892a6;
            --border: #2a3550;
        }

        .light {
            --primary: #0066cc;
            --accent: #6622bb;
            --success: #00aa55;
            --warning: #cc9900;
            --danger: #cc0044;
            --late: #cc5500;
            --early: #6644bb;
            --bg-dark: #f0f4f8;
            --bg-card: #ffffff;
            --text-primary: #1a202c;
            --text-secondary: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(131, 56, 236, 0.1) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite;
        }

        .light .bg-animation::before {
            background:
                radial-gradient(circle at 20% 80%, rgba(0, 102, 204, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(102, 34, 187, 0.15) 0%, transparent 50%);
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2%, -2%); }
        }

        /* Grid Pattern */
        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
        }

        /* Main Container */
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        /* Logo */
        .logo {
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        /* Scan Area */
        .scan-container {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .scan-icon {
            width: 180px;
            height: 180px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(131, 56, 236, 0.1));
            border: 4px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--primary);
            transition: all 0.5s ease;
        }

        .scan-icon.scanning {
            border-color: var(--primary);
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }

        .scan-icon.success {
            border-color: var(--success);
            color: var(--success);
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.4);
            animation: successPop 0.5s ease;
        }

        .scan-icon.error {
            border-color: var(--danger);
            color: var(--danger);
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2), rgba(255, 0, 110, 0.1));
            box-shadow: 0 0 60px rgba(255, 0, 110, 0.4);
            animation: shake 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.4);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 0 0 30px rgba(0, 240, 255, 0);
            }
        }

        @keyframes successPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .scan-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .scan-text.success {
            color: var(--success);
        }

        .scan-text.error {
            color: var(--danger);
        }

        .scan-hint {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .scan-hint.success {
            color: var(--success);
        }

        .scan-hint.error {
            color: var(--danger);
        }

        /* Status Display */
        .status-display {
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .status-display.checkin {
            display: inline-flex;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--success);
            color: var(--success);
        }

        .status-display.checkout {
            display: inline-flex;
            background: rgba(255, 190, 11, 0.1);
            border: 2px solid var(--warning);
            color: var(--warning);
        }

        /* Time Status Badge */
        .time-status-badge {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .time-status-badge.normal {
            display: inline-flex;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--success);
            color: var(--success);
        }

        .time-status-badge.late {
            display: inline-flex;
            background: rgba(255, 107, 53, 0.1);
            border: 2px solid var(--late);
            color: var(--late);
        }

        .time-status-badge.early {
            display: inline-flex;
            background: rgba(132, 94, 247, 0.1);
            border: 2px solid var(--early);
            color: var(--early);
        }

        /* Time Display */
        .time-display {
            position: fixed;
            top: 2rem;
            right: 2rem;
            text-align: right;
        }

        .current-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .current-date {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Stats Display */
        .stats-display {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 1rem 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Header Buttons */
        .header-buttons {
            position: fixed;
            top: 2rem;
            left: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .version-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }


        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }

            .logo h1 {
                font-size: 1.4rem;
            }

            .scan-container {
                padding: 2rem 1.5rem;
            }

            .scan-icon {
                width: 140px;
                height: 140px;
                font-size: 4rem;
            }

            .scan-text {
                font-size: 1.5rem;
            }

            .time-display {
                top: 1rem;
                right: 1rem;
            }

            .current-time {
                font-size: 1.5rem;
            }

            .header-buttons {
                top: 1rem;
                left: 1rem;
            }

            .version-badge, .btn-settings {
                font-size: 0.65rem;
                padding: 0.4rem 0.75rem;
            }

            .stats-display {
                bottom: 1rem;
                gap: 1.5rem;
                padding: 0.75rem 1.5rem;
            }

            .stat-value {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .time-display {
                position: static;
                margin-bottom: 1rem;
                text-align: center;
            }

            .header-buttons {
                position: static;
                flex-direction: row;
                justify-content: center;
                margin-bottom: 1rem;
            }

            .stats-display {
                position: static;
                transform: none;
                margin-top: 2rem;
            }
        }
    </style>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCCXmBJkesxRi3ufdCRucd5vcmg-Ls_3Ks",
            authDomain: "tech-society-566dc.firebaseapp.com",
            projectId: "tech-society-566dc",
            storageBucket: "tech-society-566dc.firebasestorage.app",
            messagingSenderId: "1098408063649",
            appId: "1:1098408063649:web:ec07e23e03c43f92c7f6e0",
            measurementId: "G-05127H92FQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firebaseDB = db;
        window.firestoreModules = { collection, getDocs, doc, getDoc, setDoc, updateDoc, query, orderBy };

        if (window.loadDataFromFirebase) {
            window.loadDataFromFirebase();
        }
    </script>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-pattern"></div>

    <div class="header-buttons">
        <span class="version-badge">v2.1.0</span>
    </div>

    <div class="time-display">
        <div class="current-time" id="currentTime">--:--:--</div>
        <div class="current-date" id="currentDate">----年--月--日</div>
    </div>

    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-fingerprint"></i>
            </div>
            <h1>會員簽到</h1>
            <p>科技學會 ATS</p>
        </div>

        <!-- Serial reader bar -->
        <div id="pubSerialBar" style="display:flex;align-items:center;gap:0.6rem;padding:0.6rem 1rem;margin:0 auto 0.5rem;max-width:500px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;font-size:0.85rem;flex-wrap:wrap;justify-content:center;">
            <span style="width:8px;height:8px;border-radius:50%;background:#555;transition:background 0.3s;" id="pubSerialDot"></span>
            <span id="pubSerialLabel" style="color:var(--text-secondary);flex:1;">串口讀卡機未連接</span>

            </button>
        </div>

        <div class="scan-container">
            <div class="scan-icon scanning" id="scanIcon">
                <i class="fas fa-credit-card" id="scanIconInner"></i>
            </div>
            <p class="scan-text" id="scanText">請刷會員卡</p>
            <p class="scan-hint" id="scanHint">702U 鍵盤 或 HCE-312HU 串口讀卡</p>
            <div style="margin-top:1rem;display:flex;gap:0.5rem;justify-content:center;max-width:360px;margin-left:auto;margin-right:auto;">
                <input type="text" id="manualCardInput"
                       placeholder="刷卡 / Track 2: 000112345202512"
                       style="flex:1;min-width:0;padding:0.6rem 0.8rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:16px;font-family:inherit;"
                       onkeydown="if(event.key==='Enter'){manualScan();event.preventDefault();}">
                <button onclick="manualScan()"
                        style="padding:0.6rem 1rem;border-radius:8px;border:none;background:linear-gradient(135deg,var(--primary),var(--accent));color:white;font-weight:600;cursor:pointer;white-space:nowrap;font-size:0.9rem;">
                    <i class="fas fa-search"></i> 簽到
                </button>
            </div>
            <p id="pubKeyDebug" style="font-size:0.65rem;color:var(--text-secondary);margin-top:0.25rem;font-family:monospace;opacity:0.5;"></p>

            <div class="status-display" id="statusDisplay">
                <i class="fas fa-check-circle" id="statusIcon"></i>
                <span id="statusText">簽到成功</span>
            </div>

            <div class="time-status-badge" id="timeStatusBadge">
                <i class="fas fa-clock" id="timeStatusIcon"></i>
                <span id="timeStatusText">正常</span>
            </div>
        </div>

    <div class="stats-display">
        <div class="stat-item">
            <div class="stat-value" id="statCheckin">0</div>
            <div class="stat-label">今日簽到</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statPresent">0</div>
            <div class="stat-label">目前在場</div>
        </div>
    </div>


    <script>
        // ==================== App State ====================
        let members = [];
        let records = [];
        let cardInputBuffer = '';
        let cardInputTimeout = null;
        let currentDate = new Date().toISOString().split('T')[0];
        let isFirebaseReady = false;

        // Time settings
        let settings = {
            startTime: '09:00',
            endTime: '17:00',
            enableTimeCheck: true
        };

        // ==================== Firebase Data Functions ====================
        window.loadDataFromFirebase = async function() {
            if (!window.firebaseDB || !window.firestoreModules) {
                console.log('Firebase not ready, retrying...');
                setTimeout(window.loadDataFromFirebase, 500);
                return;
            }

            isFirebaseReady = true;
            const { collection, getDocs } = window.firestoreModules;
            const db = window.firebaseDB;

            try {
                // Load members
                const membersSnapshot = await getDocs(collection(db, 'checkin_members'));
                members = [];
                membersSnapshot.forEach((doc) => {
                    members.push({ id: doc.id, ...doc.data() });
                });

                // Load records
                const recordsSnapshot = await getDocs(collection(db, 'checkin_records'));
                records = [];
                recordsSnapshot.forEach((doc) => {
                    records.push({ docId: doc.id, ...doc.data() });
                });

                records.sort((a, b) => new Date(b.time) - new Date(a.time));
                console.log(`Loaded ${members.length} members and ${records.length} records`);
                updateStats();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        };

        async function saveRecordToFirebase(record) {
            if (!isFirebaseReady) return;
            const { doc, setDoc } = window.firestoreModules;
            const db = window.firebaseDB;

            try {
                const recordId = record.docId || `${record.memberId}_${Date.now()}`;
                await setDoc(doc(db, 'checkin_records', recordId), {
                    memberId: record.memberId,
                    name: record.name,
                    class: record.class,
                    number: record.number,
                    type: record.type,
                    time: record.time,
                    checkoutTime: record.checkoutTime || null,
                    timeStatus: record.timeStatus || null
                });
                return recordId;
            } catch (error) {
                console.error('Error saving record:', error);
                throw error;
            }
        }

        async function updateRecordInFirebase(record) {
            if (!isFirebaseReady || !record.docId) return;
            const { doc, updateDoc } = window.firestoreModules;
            const db = window.firebaseDB;

            try {
                await updateDoc(doc(db, 'checkin_records', record.docId), {
                    checkoutTime: record.checkoutTime,
                    timeStatus: record.timeStatus,
                    type: record.type
                });
            } catch (error) {
                console.error('Error updating record:', error);
                throw error;
            }
        }

        // ==================== Initialize ====================
        document.addEventListener('DOMContentLoaded', function() {
            // Theme detection
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.remove('light');
            } else {
                document.body.classList.add('light');
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                document.body.classList.toggle('light', !event.matches);
            });

            // Load settings
            loadSettings();

            // Check if Firebase is ready
            if (window.firebaseReady) {
                window.loadDataFromFirebase();
            }

            // Update time display
            updateTimeDisplay();
            setInterval(updateTimeDisplay, 1000);

            // Check for day change
            setInterval(checkDayChange, 60000);

            // Update stats
            updateStats();

            // Global keyboard listener
            document.addEventListener('keydown', handleGlobalKeydown);

            // Auto-focus input for 702U reader
            var inp = document.getElementById('manualCardInput');
            if (inp) { inp.focus(); }
        });

        // ==================== Settings ====================
        function loadSettings() {
            // Read settings from URL parameters (set by admin page)
            const urlParams = new URLSearchParams(window.location.search);

            if (urlParams.has('start')) {
                settings.startTime = urlParams.get('start');
            }
            if (urlParams.has('end')) {
                settings.endTime = urlParams.get('end');
            }
            if (urlParams.has('enable')) {
                settings.enableTimeCheck = urlParams.get('enable') === '1';
            }
        }

        // ==================== Time Status Check ====================
        function getTimeStatus(type) {
            if (!settings.enableTimeCheck) return null;

            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const [startHour, startMin] = settings.startTime.split(':').map(Number);
            const startMinutes = startHour * 60 + startMin;

            const [endHour, endMin] = settings.endTime.split(':').map(Number);
            const endMinutes = endHour * 60 + endMin;

            if (type === 'checkin') {
                // Check if late
                if (currentMinutes > startMinutes) {
                    return 'late';
                }
                return 'normal';
            } else if (type === 'checkout') {
                // Check if early leave
                if (currentMinutes < endMinutes) {
                    return 'early';
                }
                return 'normal';
            }

            return 'normal';
        }

        function getTimeStatusText(status) {
            switch (status) {
                case 'late': return '遲到';
                case 'early': return '早退';
                case 'normal': return '正常';
                default: return '';
            }
        }

        function getTimeStatusIcon(status) {
            switch (status) {
                case 'late': return 'fa-clock';
                case 'early': return 'fa-running';
                case 'normal': return 'fa-check-circle';
                default: return 'fa-clock';
            }
        }

        // ==================== Time Display ====================
        function updateTimeDisplay() {
            const now = new Date();
            document.getElementById('currentTime').textContent =
                now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentDate').textContent =
                now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }

        // ==================== Day Change Check ====================
        function checkDayChange() {
            const today = new Date().toISOString().split('T')[0];
            if (today !== currentDate) {
                // Day has changed - reset incomplete records
                currentDate = today;

                // Mark all incomplete checkins as expired (no checkout needed)
                records.forEach(r => {
                    if (r.type === 'checkin' && !r.checkoutTime) {
                        r.type = 'expired';
                    }
                });

                updateStats();
            }
        }

        // ==================== Toast ====================
        function showToast(message, type) {
            var existing = document.getElementById('pubToast');
            if (existing) existing.remove();
            var t = document.createElement('div');
            t.id = 'pubToast';
            var bg = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            t.style.cssText = 'position:fixed;top:1rem;left:50%;transform:translateX(-50%);padding:0.8rem 1.5rem;border-radius:12px;color:#fff;font-weight:600;z-index:9999;font-size:0.9rem;background:' + bg + ';box-shadow:0 4px 20px rgba(0,0,0,0.3);transition:opacity 0.3s;';
            t.textContent = message;
            document.body.appendChild(t);
            setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 3000);
        }

        // ==================== HCE-312HU Serial Reader ====================
        var serialPort = null;
        var serialReader = null;
        var serialWriter = null;
        var isSerialConnected = false;
        var serialReadBuffer = [];
        var serialReadLoopRunning = false;
        var pubScanLooping = false;

        function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

        async function togglePubSerial() {
            if (isSerialConnected) {
                await disconnectPubSerial();
            } else {
                await connectPubSerial();
            }
        }

        async function connectPubSerial() {
            if (!('serial' in navigator)) {
                showToast('此瀏覽器不支援 Web Serial API，請使用 Chrome 或 Edge', 'error');
                return;
            }
            try {
                serialPort = await navigator.serial.requestPort({ filters: [] });
                await serialPort.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none' });
                serialWriter = serialPort.writable.getWriter();
                serialReader = serialPort.readable.getReader();
                serialReadBuffer = [];
                startPubReadLoop();
                isSerialConnected = true;
                updatePubSerialUI(true);
                showToast('HCE-312HU 已連接', 'success');
                startPubScanLoop();
            } catch (err) {
                if (err.name !== 'NotFoundError') {
                    showToast('連接失敗: ' + (err.message || err), 'error');
                }
            }
        }

        async function disconnectPubSerial() {
            pubScanLooping = false;
            serialReadLoopRunning = false;
            isSerialConnected = false;
            try { if (serialReader) { await serialReader.cancel(); serialReader.releaseLock(); serialReader = null; } } catch (e) { serialReader = null; }
            try { if (serialWriter) { serialWriter.releaseLock(); serialWriter = null; } } catch (e) { serialWriter = null; }
            try { if (serialPort) { await serialPort.close(); serialPort = null; } } catch (e) { serialPort = null; }
            serialReadBuffer = [];
            updatePubSerialUI(false);
            showToast('已斷開連接', 'success');
        }

        function updatePubSerialUI(connected) {
            var dot = document.getElementById('pubSerialDot');
            var label = document.getElementById('pubSerialLabel');
            var btnText = document.getElementById('pubSerialBtnText');
            if (!dot) return;
            if (connected) {
                dot.style.background = 'var(--success)';
                label.innerHTML = '<strong>HCE-312HU</strong> 已連接';
                label.style.color = 'var(--success)';
                btnText.textContent = '斷開連接';
            } else {
                dot.style.background = '#555';
                label.textContent = '串口讀卡機未連接';
                label.style.color = 'var(--text-secondary)';
                btnText.textContent = '連接 HCE-312HU';
            }
        }

        function isPubSerialReadable() {
            return serialReadLoopRunning && serialReader != null;
        }

        async function startPubReadLoop() {
            if (serialReadLoopRunning) return;
            serialReadLoopRunning = true;
            try {
                while (isPubSerialReadable()) {
                    var result = await serialReader.read();
                    if (result.done) break;
                    if (result.value) {
                        for (var i = 0; i < result.value.length; i++) {
                            serialReadBuffer.push(result.value[i]);
                        }
                    }
                }
            } catch (e) {
                if (serialReadLoopRunning) {
                    console.log('Serial read loop ended: ' + (e.message || e));
                }
            }
            serialReadLoopRunning = false;
        }

        function drainPubBuffer() { serialReadBuffer = []; }

        async function readPubResponse(timeoutMs) {
            var deadline = Date.now() + (timeoutMs || 3000);
            while (Date.now() < deadline) {
                if (serialReadBuffer.length > 0) {
                    await sleep(100);
                    var result = serialReadBuffer.slice();
                    serialReadBuffer = [];
                    return result;
                }
                await sleep(50);
            }
            if (serialReadBuffer.length > 0) {
                var r = serialReadBuffer.slice();
                serialReadBuffer = [];
                return r;
            }
            return null;
        }

        function isPubScanActive() {
            return pubScanLooping && isSerialConnected;
        }

        async function startPubScanLoop() {
            if (pubScanLooping) return;
            pubScanLooping = true;
            while (isPubScanActive()) {
                await pubSerialScanRead();
                if (isPubScanActive()) {
                    await sleep(1500);
                }
            }
            pubScanLooping = false;
        }

        async function pubSerialScanRead() {
            if (!isSerialConnected || !serialWriter) return;
            drainPubBuffer();
            try {
                await serialWriter.write(new Uint8Array([0x1B, 0x72, 0x1D, 0x1B, 0x5C]));
            } catch (err) { return; }
            var resp = await readPubResponse(10000);
            if (!resp || resp.length < 4) return;

            var cardStr = null;
            var i;
            // Standard format: ESC s [indicator] [data] ? FS
            if (resp[0] === 0x1B && resp[1] === 0x73) {
                var ds = 2;
                if (resp[ds] <= 0x03) { ds++; }
                var de = resp.length;
                for (i = ds; i < resp.length; i++) {
                    if (resp[i] === 0x1C) { de = i; break; }
                }
                var str = resp.slice(ds, de).map(function(b) { return String.fromCharCode(b); }).join('');
                if (str.endsWith('?')) { str = str.slice(0, -1); }
                cardStr = '%' + str + '?';
            }
            // ECM format
            if (!cardStr) {
                var stxI = -1, gsI = -1;
                for (i = 0; i < resp.length; i++) {
                    if (resp[i] === 0x02 && stxI === -1) { stxI = i; }
                    if (resp[i] === 0x1D && stxI !== -1) { gsI = i; break; }
                }
                if (stxI > 0 && gsI > stxI) {
                    var t1 = resp.slice(stxI + 1, gsI).map(function(b) { return String.fromCharCode(b); }).join('');
                    cardStr = '%' + t1 + '?';
                }
            }
            if (cardStr && cardStr.length > 4) {
                processCardData(cardStr);
            }
        }

        // ==================== Card Reader ====================
        // Card reader detection — works even inside input fields.
        // The 702U sends keystrokes very fast (<50ms apart). We detect this pattern
        // to distinguish card reader input from human typing.
        let lastKeyTime = 0;
        let cardReaderDetected = false;

        function handleGlobalKeydown(e) {
            const now = Date.now();
            const isInInput = (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');

            // Debug: show last keystrokes
            var dbg = document.getElementById('pubKeyDebug');
            if (dbg) {
                var gap = now - lastKeyTime;
                dbg.textContent = 'KEY: ' + JSON.stringify(e.key) + ' gap=' + gap + 'ms buf=' + cardInputBuffer.length;
            }

            // Detect card reader: first char is % or ; OR we're already buffering
            if (e.key === '%' || e.key === ';' || cardInputBuffer.length > 0) {

                // If typing into an input and this looks like human speed (>80ms gap),
                // let it through normally UNLESS we already started capturing card data
                if (isInInput && cardInputBuffer.length === 0 && e.key !== '%' && e.key !== ';') {
                    return; // normal typing in input
                }

                // Once we see % or ;, start capturing regardless of focus
                if (e.key === '%' || e.key === ';') {
                    cardReaderDetected = false; // reset
                    cardInputBuffer = '';
                }

                if (e.key === 'Enter') {
                    const bufferData = cardInputBuffer;
                    cardInputBuffer = '';
                    clearTimeout(cardInputTimeout);

                    if (bufferData.length > 3) {
                        // Clear any input field that captured partial data
                        if (isInInput && e.target.value) {
                            e.target.value = '';
                        }
                        try { processCardData(bufferData); } catch (err) { console.log('processCardData error: ' + (err.message || err)); }
                        e.preventDefault();
                    }
                } else if (e.key.length === 1) {
                    // Check speed — card reader types < 50ms between keys
                    const gap = now - lastKeyTime;
                    if (cardInputBuffer.length <= 1 || gap < 80) {
                        cardReaderDetected = (gap < 80 && cardInputBuffer.length > 2);
                    }
                    lastKeyTime = now;

                    cardInputBuffer += e.key;

                    clearTimeout(cardInputTimeout);
                    cardInputTimeout = setTimeout(() => {
                        if (cardInputBuffer.length > 5) {
                            try { processCardData(cardInputBuffer); } catch (err) { console.log('processCardData error: ' + (err.message || err)); }
                            // Clear input field if it captured card data
                            const focused = document.activeElement;
                            if (focused && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA')) {
                                focused.value = '';
                            }
                        }
                        cardInputBuffer = '';
                        cardReaderDetected = false;
                    }, 200);

                    // If card reader detected or first few chars, prevent input
                    if (cardReaderDetected || cardInputBuffer.length <= 3) {
                        e.preventDefault();
                    }
                }
            }
        }

        function manualScan() {
            const input = document.getElementById('manualCardInput');
            const val = input.value.trim();
            if (!val) return;
            processCardData(val);
            input.value = '';
        }

        function processCardData(data) {
            console.log('Card data: ' + data);

            // If a previous result is showing, reset immediately for the new scan
            resetDisplay();

            let parsed = null;

            // Parse Track 1 ATS format: %ATS^會員編號^英文姓名^班別^學號?
            // Also handles | and < separators for backward compatibility
            const atsMatch = data.match(/%ATS[\^|<]([^\^|<?]+)[\^|<]([^\^|<?]+)[\^|<]([^\^|<?]+)[\^|<]([^?]+)\??/);
            if (atsMatch) {
                const cardId = atsMatch[1];
                // Look up Chinese name from Firebase members
                const dbMember = members.find(m => m.id === cardId);
                parsed = {
                    id: cardId,
                    name: dbMember ? dbMember.name : atsMatch[2],
                    class: atsMatch[3],
                    number: atsMatch[4]
                };
            }

            // Parse Track 2 numeric format: NNNNSSSSSYYYYMM (with or without ; and ?)
            if (!parsed) {
                const t2Match = data.match(/;?(\d{4})(\d{5})(\d{6})\??/);
                if (t2Match) {
                    const memberNum = parseInt(t2Match[1]);
                    const studentNum = t2Match[2];
                    const dbMember = members.find(m => {
                        const mNum = parseInt(m.id.replace(/\D/g, '') || '0');
                        return mNum === memberNum;
                    }) || members.find(m => m.number === studentNum);
                    if (dbMember) {
                        parsed = { ...dbMember };
                    } else {
                        parsed = {
                            id: 'M' + t2Match[1],
                            name: 'M' + t2Match[1],
                            class: '--',
                            number: studentNum
                        };
                    }
                }
            }

            // Try simple separator format (^, |, or <)
            if (!parsed) {
                const simpleMatch = data.match(/[%;]([^\^|<?]+)[\^|<]([^\^|<?]+)[\^|<]([^\^|<?]+)[\^|<]([^?]+)\??/);
                if (simpleMatch) {
                    const cardId = simpleMatch[1];
                    const dbMember = members.find(m => m.id === cardId);
                    parsed = {
                        id: cardId,
                        name: dbMember ? dbMember.name : simpleMatch[2],
                        class: simpleMatch[3],
                        number: simpleMatch[4]
                    };
                }
            }

            // Try member ID lookup
            if (!parsed) {
                let cleanData = data.replace(/^[%;]/, '').replace(/\?$/, '').trim();
                const member = members.find(m =>
                    m.id === cleanData ||
                    m.number === cleanData ||
                    m.id.toLowerCase() === cleanData.toLowerCase()
                );
                if (member) {
                    parsed = { ...member };
                }
            }

            if (parsed) {
                handleSwipe(parsed);
            } else {
                showError();
            }
        }

        async function handleSwipe(member) {
            const now = new Date();
            const today = now.toISOString().split('T')[0];

            // Find today's active checkin for this member
            const todayCheckin = records.find(r => {
                const recordDate = new Date(r.time).toISOString().split('T')[0];
                return r.memberId === member.id && recordDate === today && r.type === 'checkin' && !r.checkoutTime;
            });

            try {
                if (todayCheckin) {
                    // Checkout (離開)
                    todayCheckin.checkoutTime = now.toISOString();
                    todayCheckin.type = 'completed';
                    const timeStatus = getTimeStatus('checkout');
                    todayCheckin.timeStatus = timeStatus;

                    // Save to Firebase
                    await updateRecordInFirebase(todayCheckin);

                    showSuccess('checkout', timeStatus);
                    playCheckoutSound();
                } else {
                    // Checkin (進入)
                    const timeStatus = getTimeStatus('checkin');
                    const newRecord = {
                        memberId: member.id,
                        name: member.name,
                        class: member.class,
                        number: member.number,
                        time: now.toISOString(),
                        type: 'checkin',
                        checkoutTime: null,
                        timeStatus: timeStatus
                    };

                    // Save to Firebase
                    const docId = await saveRecordToFirebase(newRecord);
                    newRecord.docId = docId;
                    records.unshift(newRecord);

                    showSuccess('checkin', timeStatus);
                    playCheckinSound();
                }

                updateStats();
            } catch (error) {
                console.error('Error handling swipe:', error);
                showError();
            }
        }

        function showSuccess(type, timeStatus) {
            const scanIcon = document.getElementById('scanIcon');
            const scanIconInner = document.getElementById('scanIconInner');
            const scanText = document.getElementById('scanText');
            const scanHint = document.getElementById('scanHint');
            const statusDisplay = document.getElementById('statusDisplay');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const timeStatusBadge = document.getElementById('timeStatusBadge');
            const timeStatusIcon = document.getElementById('timeStatusIcon');
            const timeStatusText = document.getElementById('timeStatusText');

            // Update icon
            scanIcon.classList.remove('scanning', 'error');
            scanIcon.classList.add('success');
            scanIconInner.className = 'fas fa-check';

            // Update text
            scanText.textContent = '刷卡成功';
            scanText.classList.remove('error');
            scanText.classList.add('success');

            if (type === 'checkin') {
                scanHint.textContent = '歡迎進入！';
                statusDisplay.className = 'status-display checkin';
                statusIcon.className = 'fas fa-sign-in-alt';
                statusText.textContent = '已進入';
            } else {
                scanHint.textContent = '再見！';
                statusDisplay.className = 'status-display checkout';
                statusIcon.className = 'fas fa-sign-out-alt';
                statusText.textContent = '已離開';
            }
            scanHint.classList.remove('error');
            scanHint.classList.add('success');

            // Show time status if enabled
            if (timeStatus && settings.enableTimeCheck) {
                timeStatusBadge.className = 'time-status-badge ' + timeStatus;
                timeStatusIcon.className = 'fas ' + getTimeStatusIcon(timeStatus);
                timeStatusText.textContent = getTimeStatusText(timeStatus);
            } else {
                timeStatusBadge.className = 'time-status-badge';
            }

            // Reset after delay
            setTimeout(resetDisplay, 3000);
        }

        function showError() {
            const scanIcon = document.getElementById('scanIcon');
            const scanIconInner = document.getElementById('scanIconInner');
            const scanText = document.getElementById('scanText');
            const scanHint = document.getElementById('scanHint');
            const statusDisplay = document.getElementById('statusDisplay');
            const timeStatusBadge = document.getElementById('timeStatusBadge');

            // Update icon
            scanIcon.classList.remove('scanning', 'success');
            scanIcon.classList.add('error');
            scanIconInner.className = 'fas fa-times';

            // Update text
            scanText.textContent = '刷卡失敗';
            scanText.classList.remove('success');
            scanText.classList.add('error');
            scanHint.textContent = '無法識別卡片';
            scanHint.classList.remove('success');
            scanHint.classList.add('error');

            // Hide status
            statusDisplay.className = 'status-display';
            timeStatusBadge.className = 'time-status-badge';

            playErrorSound();

            // Reset after delay
            setTimeout(resetDisplay, 2000);
        }

        function resetDisplay() {
            const scanIcon = document.getElementById('scanIcon');
            const scanIconInner = document.getElementById('scanIconInner');
            const scanText = document.getElementById('scanText');
            const scanHint = document.getElementById('scanHint');
            const statusDisplay = document.getElementById('statusDisplay');
            const timeStatusBadge = document.getElementById('timeStatusBadge');

            scanIcon.classList.remove('success', 'error');
            scanIcon.classList.add('scanning');
            scanIconInner.className = 'fas fa-credit-card';

            scanText.textContent = '請刷會員卡';
            scanText.classList.remove('success', 'error');
            scanHint.textContent = '將磁條卡在讀卡機上刷過';
            scanHint.classList.remove('success', 'error');

            statusDisplay.className = 'status-display';
            timeStatusBadge.className = 'time-status-badge';
        }

        // ==================== Stats ====================
        function updateStats() {
            const today = new Date().toISOString().split('T')[0];

            const todayRecords = records.filter(r => {
                const recordDate = new Date(r.time).toISOString().split('T')[0];
                return recordDate === today;
            });

            // Unique members who checked in today
            const uniqueCheckins = [...new Set(todayRecords.map(r => r.memberId))].length;

            // Currently present (checked in but not checked out)
            const presentCount = todayRecords.filter(r => r.type === 'checkin' && !r.checkoutTime).length;

            document.getElementById('statCheckin').textContent = uniqueCheckins;
            document.getElementById('statPresent').textContent = presentCount;
        }

        // ==================== Audio ====================
        function playCheckinSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.value = 0.3;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function playCheckoutSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();

                // First beep
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.frequency.value = 660;
                osc1.type = 'sine';
                gain1.gain.value = 0.3;
                osc1.start();
                gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc1.stop(ctx.currentTime + 0.1);

                // Second beep
                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.frequency.value = 880;
                    osc2.type = 'sine';
                    gain2.gain.value = 0.3;
                    osc2.start();
                    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc2.stop(ctx.currentTime + 0.15);
                }, 120);
            } catch (e) {}
        }

        function playErrorSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 200;
                osc.type = 'square';
                gain.gain.value = 0.2;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }

        // ==================== Load Members ====================
        // Members are now loaded from Firebase via loadDataFromFirebase()
    </script>
</body>
</html>
